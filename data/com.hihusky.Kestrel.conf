<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- SPDX-License-Identifier: LGPL-2.1-or-later -->
<!--
  Install to /usr/share/dbus-1/system.d/com.hihusky.Kestrel.conf.

  Only root may own the name. Non-root callers may only invoke Kestrel's
  public com.hihusky.Kestrel.* and standard org.freedesktop.DBus.* interfaces
  (never internal backend agent callbacks such as net.connman.iwd.Agent).
  Every mutating method is authorized by polkit (com.hihusky.kestrel.policy).
-->
<busconfig>
  <policy user="root">
    <allow own="com.hihusky.Kestrel"/>
    <allow send_destination="com.hihusky.Kestrel"/>
    <!-- Kestrel calls back into agents that consumers register. -->
    <allow send_interface="com.hihusky.Kestrel.Agent"/>
  </policy>

  <policy context="default">
    <allow send_destination="com.hihusky.Kestrel" send_interface="com.hihusky.Kestrel.Manager"/>
    <allow send_destination="com.hihusky.Kestrel" send_interface="com.hihusky.Kestrel.Device"/>
    <allow send_destination="com.hihusky.Kestrel" send_interface="com.hihusky.Kestrel.P2P"/>
    <allow send_destination="com.hihusky.Kestrel" send_interface="com.hihusky.Kestrel.Hotspot"/>
    <allow send_destination="com.hihusky.Kestrel" send_interface="com.hihusky.Kestrel.Profile"/>
    <allow send_destination="com.hihusky.Kestrel" send_interface="com.hihusky.Kestrel.Certificate"/>
    <allow send_destination="com.hihusky.Kestrel" send_interface="com.hihusky.Kestrel.P2pGroup"/>
    <allow send_destination="com.hihusky.Kestrel" send_interface="com.hihusky.Kestrel.Session"/>
    <allow send_destination="com.hihusky.Kestrel" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="com.hihusky.Kestrel" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="com.hihusky.Kestrel" send_interface="org.freedesktop.DBus.ObjectManager"/>
    <allow send_destination="com.hihusky.Kestrel" send_interface="org.freedesktop.DBus.Peer"/>
    <deny send_destination="com.hihusky.Kestrel" send_interface="net.connman.iwd.Agent"/>
  </policy>
</busconfig>
