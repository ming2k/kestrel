[workspace]
resolver = "3"
members = ["crates/*", "tests"]

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.89"
license = "LGPL-2.1-or-later"
repository = "https://github.com/ming2k/kestrel"

[workspace.dependencies]
async-trait = "0.1.89"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.31"
ipnet = { version = "2.12.2", features = ["serde"] }
proptest = "1.9.0"
rpassword = "7.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.2.1"
tracing = "0.1.42"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
uuid = { version = "1.20.0", features = ["serde", "v4"] }
zbus = { version = "6.3.0", default-features = false, features = ["object-manager", "proxy", "service", "tokio"] }
zeroize = "1.8.2"

# Internal crates.
kestrel-api = { path = "crates/kestrel-api" }
kestrel-catalog = { path = "crates/kestrel-catalog" }
kestrel-controller = { path = "crates/kestrel-controller" }
kestrel-e2e = { path = "crates/kestrel-e2e" }
kestrel-l3-networkd = { path = "crates/kestrel-l3-networkd" }
kestrel-machines = { path = "crates/kestrel-machines" }
kestrel-model = { path = "crates/kestrel-model" }
kestrel-ports = { path = "crates/kestrel-ports" }
kestrel-store = { path = "crates/kestrel-store" }
kestrel-testkit = { path = "crates/kestrel-testkit" }
kestrel-wlan-iwd = { path = "crates/kestrel-wlan-iwd" }
kestrel-wlan-wpa = { path = "crates/kestrel-wlan-wpa" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
