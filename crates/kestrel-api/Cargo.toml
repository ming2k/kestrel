[package]
name = "kestrel-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Kestrel's D-Bus API (com.hihusky.Kestrel): server, polkit authorization, and typed client"

[features]
default = ["client"]
client = []
server = [
    "client",
    "dep:async-trait",
    "dep:futures-util",
    "dep:kestrel-catalog",
    "dep:kestrel-controller",
    "dep:kestrel-ports",
    "dep:tokio",
    "dep:tracing",
]

[dependencies]
async-trait = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
kestrel-catalog = { workspace = true, optional = true }
kestrel-controller = { workspace = true, optional = true }
kestrel-model.workspace = true
kestrel-ports = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
zbus.workspace = true

[dev-dependencies]
async-trait.workspace = true
kestrel-api = { path = ".", features = ["server"] }
kestrel-catalog.workspace = true
kestrel-controller.workspace = true
kestrel-ports.workspace = true
kestrel-testkit.workspace = true
tokio = { workspace = true }

[lints]
workspace = true
